# Database config for local run
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:enterprise_trading_platform}
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASSWORD:your_password_here}
spring.datasource.driver-class-name=org.postgresql.Driver

# MyBatis config
mybatis.configuration.map-underscore-to-camel-case=true

# Kafka config for local run
spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}

# Server config
server.port=8082

# Logging
logging.level.com.tradingplatform=DEBUG
logging.level.org.springframework.kafka=INFO
