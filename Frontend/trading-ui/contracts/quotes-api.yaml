openapi: 3.1.0

info:
  title: Market Data Quotes REST API
  version: 1.0.0
  summary: Intraday quote data endpoints for the Enterprise Trading Platform.
  description: |
    Provides real-time and historical quote data (price, bid/ask) from the in-memory cache.
    Updated by Fauxnance refresh (every 5 minutes) or market-data Kafka topic.
    Data retention is 24 hours by default.

servers:
  - url: http://localhost:8080

paths:
  /api/v1/market-data/quotes:
    get:
      operationId: getQuotesForDay
      summary: Get cached quotes for a specific day and optional symbol
      tags:
        - Quotes
      parameters:
        - name: date
          in: query
          required: false
          schema:
            type: string
            format: date
          description: UTC date (YYYY-MM-DD). Default is today.
        - name: symbol
          in: query
          required: false
          schema:
            type: string
          description: Instrument symbol (e.g., AAPL, FX:EURUSD). If omitted, returns all symbols.
      responses:
        '200':
          description: Quotes received on the requested day, oldest first
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CachedQuotesDayResponse'
        '400':
          description: Invalid date format or parameters
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/v1/market-data/quotes/{symbol}/latest:
    get:
      operationId: getLatestQuote
      summary: Get the most recent cached quote for a symbol
      tags:
        - Quotes
      parameters:
        - name: symbol
          in: path
          required: true
          schema:
            type: string
          description: Instrument symbol (e.g., AAPL, FX:EURUSD)
      responses:
        '200':
          description: Latest cached quote
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CachedQuoteResponse'
        '404':
          description: No quote found for the symbol
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

components:
  schemas:
    CachedQuoteResponse:
      type: object
      required:
        - symbol
        - price
        - bid
        - ask
        - currency
        - quoteAsOf
        - receivedAt
      properties:
        symbol:
          type: string
          description: Instrument symbol
        price:
          type: number
          format: decimal
          description: Last observed price (midpoint)
        bid:
          type: number
          format: decimal
          description: Bid price (sell side)
        ask:
          type: number
          format: decimal
          description: Ask price (buy side)
        currency:
          type: string
          description: ISO 4217 currency code
        change:
          type: number
          format: decimal
          nullable: true
          description: Absolute change vs previous close (null for Fauxnance data)
        changePercent:
          type: number
          format: decimal
          nullable: true
          description: Percentage change (null for Fauxnance data)
        previousClose:
          type: number
          format: decimal
          nullable: true
          description: Previous closing price (null for Fauxnance data)
        marketState:
          type: string
          nullable: true
          description: Market state (null for Fauxnance data)
        stale:
          type: boolean
          description: True if quote was past freshness window when received
        quoteAsOf:
          type: string
          format: date-time
          description: Observation time from the data source
        receivedAt:
          type: string
          format: date-time
          description: When the cache received this quote

    CachedQuotesDayResponse:
      type: object
      required:
        - date
        - symbol
        - count
        - rows
      properties:
        date:
          type: string
          format: date
          description: The UTC date requested
        symbol:
          type: string
          nullable: true
          description: Filtered symbol (null if all symbols requested)
        count:
          type: integer
          description: Number of quotes in the response
        rows:
          type: array
          items:
            $ref: '#/components/schemas/CachedQuoteResponse'
          description: Quotes received on the day, oldest first

    ErrorResponse:
      type: object
      required:
        - errorCode
        - message
      properties:
        errorCode:
          type: string
          description: Machine-readable error code
        message:
          type: string
          description: Human-readable error message
