openapi: 3.1.0

info:
  title: Customer Preferences REST API
  version: 1.0.0
  summary: Customer preferences for the Enterprise Trading Platform.
  description: |
    Binding contract for the customer preferences endpoints of the Trade REST API (Sprint 10,
    module `com.tradingplatform.preferences`). The Angular UI generates its typed client from this
    file, so a field renamed here is a compile error there.

    ## Identifiers

    `accountId` means the numeric surrogate key `ACCOUNTS.id` everywhere in this contract: in the
    path parameter and in the JWT `accountId` claim. One user holds exactly one account, so the
    preference record is keyed on that account.

    ## What a preference holds

    - `alertChannels`: every channel the platform reaches the customer on about their trades and
      alerts. One to three entries, each channel at most once (`PREF-422` otherwise). A
      notification is delivered on each chosen channel.
    - `channel`: one of `EMAIL`, `SMS` or `IN_APP`. The set is closed: there is no webhook or URL
      channel, so no customer can make the platform post to a destination of their choosing.
    - `contactDetail`: the address for that channel, one per channel. Several addresses for one
      channel are out of scope. Required for `EMAIL` (an email address, at most 254 characters)
      and `SMS` (an E.164 number such as `+447700900123`). Must be absent or null for `IN_APP`,
      which delivers to the platform's own notification inbox.

    Entries are returned in the order `EMAIL`, `SMS`, `IN_APP`, whatever order they were sent in.

    Contact details are personal data. They are encrypted at rest, returned only to the owning
    account, and never written to logs or Kafka payloads.

    ## When nothing has been stored

    `GET` answers `200` with the platform default, a single `IN_APP` entry with no contact detail, and
    `configured: false`. It never answers an empty body or `404` for an account that has simply not
    chosen yet. `DELETE` returns an account to that state.

    ## Internal resolution

    The notifications module resolves a customer's channel through the in-process Java interface
    `com.tradingplatform.preferences.PreferenceResolver`. That path is deliberately **not** part of
    this contract and has no HTTP route: a resolution route reachable with a customer token would
    let any customer read another customer's contact details.

    ## Admins

    Admins have no trading account of their own, so their preferences are keyed by the admin's user
    id (the JWT `sub` claim) and served under `/api/v1/admin/preferences`, with no id in the path:
    an admin only ever reads and changes their own. The channel rules, validation and encryption are
    the same as for customers. Admins are notified on their chosen channels through
    `POST /api/v1/admin/notifications/customer-registered`, which the admin UI calls after a
    customer has been registered; `EMAIL` and `SMS` go through the same sender stubs as customer
    notifications, and the answer says whether `IN_APP` (the UI bell) was chosen.

    ## Authentication

    Every `/api/v1/**` route requires a valid signed JWT in the `Authorization` header. A missing,
    malformed, expired or wrongly signed token is `AUTH-401`, 401. A valid token whose `accountId`
    claim does not match the account being addressed is `ACC-403`, 403. Another account's
    preferences are refused, never returned empty. `/api/v1/admin/**` routes also need the `ADMIN`
    role; without it they answer `AUTH-403`, 403.

  contact:
    name: Enterprise Trading Platform, programme materials
  license:
    name: Instructional use only

servers:
  - url: http://localhost:8081
    description: Local development, the Trade REST API

tags:
  - name: Preferences
    description: Read, replace and reset the signed-in customer's preferences.
  - name: Admin Preferences
    description: Read, replace and reset the signed-in admin's own preferences.
  - name: Admin Notifications
    description: Notify the signed-in admin on the channels they chose.

security:
  - bearerAuth: []

paths:
  /api/v1/accounts/{accountId}/preferences:
    get:
      tags: [Preferences]
      operationId: getPreferences
      summary: Read the account's preferences
      description: |
        The stored preferences, or the platform default (`IN_APP`, `configured: false`) when the
        customer has not chosen yet.
      parameters:
        - $ref: '#/components/parameters/AccountIdPath'
      responses:
        '200':
          description: The account's preferences.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PreferencesResponse'
        '401':
          $ref: '#/components/responses/Unauthorised'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/AccountNotFound'
    put:
      tags: [Preferences]
      operationId: updatePreferences
      summary: Replace the account's preferences
      description: Full replacement. Every field in the request is the new stored value.
      parameters:
        - $ref: '#/components/parameters/AccountIdPath'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PreferencesRequest'
      responses:
        '200':
          description: The preferences as now stored.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PreferencesResponse'
        '401':
          $ref: '#/components/responses/Unauthorised'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/AccountNotFound'
        '422':
          $ref: '#/components/responses/Invalid'
    delete:
      tags: [Preferences]
      operationId: resetPreferences
      summary: Reset the account to the platform default
      description: Removes the stored preferences, including the contact detail. Idempotent.
      parameters:
        - $ref: '#/components/parameters/AccountIdPath'
      responses:
        '204':
          description: Preferences removed; the account now resolves to the platform default.
        '401':
          $ref: '#/components/responses/Unauthorised'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/AccountNotFound'

  /api/v1/admin/preferences:
    get:
      tags: [Admin Preferences]
      operationId: getAdminPreferences
      summary: Read the signed-in admin's preferences
      description: |
        The stored preferences, or the platform default (`IN_APP`, `configured: false`) when the
        admin has not chosen yet.
      responses:
        '200':
          description: The admin's preferences.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminPreferencesResponse'
        '401':
          $ref: '#/components/responses/Unauthorised'
        '403':
          $ref: '#/components/responses/AdminForbidden'
    put:
      tags: [Admin Preferences]
      operationId: updateAdminPreferences
      summary: Replace the signed-in admin's preferences
      description: Full replacement, with the same rules as the customer route.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PreferencesRequest'
      responses:
        '200':
          description: The preferences as now stored.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminPreferencesResponse'
        '401':
          $ref: '#/components/responses/Unauthorised'
        '403':
          $ref: '#/components/responses/AdminForbidden'
        '422':
          $ref: '#/components/responses/Invalid'
    delete:
      tags: [Admin Preferences]
      operationId: resetAdminPreferences
      summary: Reset the signed-in admin to the platform default
      description: Removes the stored preferences, including the contact details. Idempotent.
      responses:
        '204':
          description: Preferences removed; the admin now resolves to the platform default.
        '401':
          $ref: '#/components/responses/Unauthorised'
        '403':
          $ref: '#/components/responses/AdminForbidden'

  /api/v1/admin/notifications/customer-registered:
    post:
      tags: [Admin Notifications]
      operationId: notifyCustomerRegistered
      summary: Tell the signed-in admin that a customer was registered
      description: |
        Called by the admin UI after the auth service has registered a customer. Sends the notice
        on each of the signed-in admin's `EMAIL` and `SMS` channels (stubs today: logged, not
        delivered) and answers with every channel chosen. When `IN_APP` is among them the UI adds the
        notice to the admin's bell. The notice only ever goes to the calling admin.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CustomerRegisteredRequest'
      responses:
        '200':
          description: The channels the notice went to.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminNotificationResponse'
        '401':
          $ref: '#/components/responses/Unauthorised'
        '403':
          $ref: '#/components/responses/AdminForbidden'
        '422':
          description: The username or account id is not valid (`VAL-422`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  parameters:
    AccountIdPath:
      name: accountId
      in: path
      required: true
      description: Numeric account key (ACCOUNTS.id); must match the token's accountId claim.
      schema:
        type: integer
        format: int64

  responses:
    Unauthorised:
      description: Missing or invalid token (`AUTH-401`).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Forbidden:
      description: Token does not reach this account (`ACC-403`).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    AdminForbidden:
      description: The token does not carry the `ADMIN` role (`AUTH-403`).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    AccountNotFound:
      description: The account does not exist (`ACC-404`).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Invalid:
      description: |
        Request body failed validation. `VAL-422` when the body is not JSON of this shape or names
        a channel outside the enum. `PREF-422` when the channel list is empty or longer than three,
        names a channel twice, has an entry without a channel, or has a contact detail that does
        not fit its channel.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'

  schemas:
    AlertChannel:
      type: string
      enum: [EMAIL, SMS, IN_APP]

    AlertChannelEntry:
      type: object
      required: [channel]
      properties:
        channel:
          $ref: '#/components/schemas/AlertChannel'
        contactDetail:
          type: [string, 'null']
          maxLength: 254
          description: |
            Email address for EMAIL, E.164 number for SMS, null for IN_APP. In a response it is
            returned only to the owning account.
          examples: ['customer@example.com', '+447700900123']

    PreferencesRequest:
      type: object
      required: [alertChannels]
      properties:
        alertChannels:
          type: array
          minItems: 1
          maxItems: 3
          description: The channels to notify on. Each channel at most once.
          items:
            $ref: '#/components/schemas/AlertChannelEntry'
      example:
        alertChannels:
          - channel: EMAIL
            contactDetail: customer@example.com
          - channel: IN_APP

    PreferencesResponse:
      type: object
      required: [accountId, alertChannels, configured]
      properties:
        accountId:
          type: integer
          format: int64
        alertChannels:
          type: array
          minItems: 1
          description: The chosen channels, or the single IN_APP default, in EMAIL, SMS, IN_APP order.
          items:
            $ref: '#/components/schemas/AlertChannelEntry'
        configured:
          type: boolean
          description: False when nothing is stored and the platform default is being shown.
        updatedAt:
          type: [string, 'null']
          format: date-time
          description: When the stored preference last changed. Null when not configured.

    AdminPreferencesResponse:
      type: object
      required: [alertChannels, configured]
      properties:
        alertChannels:
          type: array
          minItems: 1
          description: The chosen channels, or the single IN_APP default, in EMAIL, SMS, IN_APP order.
          items:
            $ref: '#/components/schemas/AlertChannelEntry'
        configured:
          type: boolean
          description: False when nothing is stored and the platform default is being shown.
        updatedAt:
          type: [string, 'null']
          format: date-time
          description: When the stored preference last changed. Null when not configured.

    CustomerRegisteredRequest:
      type: object
      required: [username, accountId]
      properties:
        username:
          type: string
          pattern: '^[a-zA-Z0-9._-]{3,64}$'
          description: The new customer's username (the auth service's registration rules).
        accountId:
          type: integer
          format: int64
          minimum: 1
          description: The account the customer was registered for.

    AdminNotificationResponse:
      type: object
      required: [channels]
      properties:
        channels:
          type: array
          minItems: 1
          description: Every channel the admin chose, in EMAIL, SMS, IN_APP order.
          items:
            $ref: '#/components/schemas/AlertChannel'

    ErrorResponse:
      type: object
      required: [errorCode, message]
      properties:
        errorCode:
          type: string
          enum: [AUTH-401, AUTH-403, ACC-403, ACC-404, VAL-422, PREF-422]
        message:
          type: string
