# SonarQube config for the Angular trading UI.
# Token and host URL are passed on the command line - never commit a token here.
sonar.projectKey=trading-ui
sonar.projectName=trading-ui
sonar.sourceEncoding=UTF-8

sonar.sources=src
sonar.tests=src
sonar.test.inclusions=**/*.spec.ts
sonar.exclusions=**/node_modules/**,src/app/api/generated/**,**/*.spec.ts

# Generated OpenAPI clients and bootstrap files are not unit-tested
sonar.coverage.exclusions=src/app/api/generated/**,src/main.ts,**/*.spec.ts,**/environment*.ts
sonar.cpd.exclusions=src/app/api/generated/**

# Produced by: npm run test:coverage
sonar.javascript.lcov.reportPaths=coverage/sprint-09-trading-ui/lcov.info
