<!-- Enterprise Trading Platform Navbar -->
<nav class="navbar">
  <div class="navbar-container">
    <!-- Logo and Brand -->
    <div class="navbar-brand">
      <div class="brand-icon">
        <i class="fas fa-chart-line"></i>
      </div>
      <div class="brand-text">
        <span class="brand-name">Enterprise Trading Platform</span>
        <span class="brand-tag">Institutional Markets</span>
      </div>
    </div>

    <!-- Spacer -->
    <div class="navbar-spacer"></div>

    <!-- Right Section: Actions and User -->
    <div class="navbar-right">
      
      <!-- Quick Actions Icons -->
      <div class="navbar-actions">
        <!-- Theme -->
        <button
          type="button"
          class="action-icon theme-toggle"
          data-testid="theme-toggle"
          (click)="themeService.toggle()"
          [attr.aria-label]="themeService.isDark() ? 'Switch to light mode' : 'Switch to dark mode'"
          [attr.aria-pressed]="themeService.isDark()"
          [title]="themeService.isDark() ? 'Switch to light mode' : 'Switch to dark mode'"
        >
          <i class="fas" [class.fa-sun]="themeService.isDark()" [class.fa-moon]="!themeService.isDark()"></i>
        </button>

        <!-- Instrument search (customers only: trading pages are customer routes) -->
        @if (canSearch()) {
          <button
            type="button"
            class="action-icon search-toggle"
            title="Search instruments (Ctrl+K)"
            aria-label="Search instruments"
            aria-haspopup="dialog"
            data-testid="instrument-search-btn"
            (click)="openSearch()"
          >
            <i class="fas fa-search"></i>
          </button>
        }

        <!-- Settings -->
        <button class="action-icon" title="Settings">
          <i class="fas fa-cog"></i>
        </button>
      </div>

      <!-- Divider -->
      <div class="navbar-divider"></div>

      <!-- User Profile -->
      <div class="user-profile-container">
        <button 
          class="user-profile-button"
          [class.open]="isProfileMenuOpen"
          (click)="toggleProfileMenu($event)"
          aria-haspopup="menu"
          [attr.aria-expanded]="isProfileMenuOpen"
        >
          <div class="user-avatar">{{ (authService.currentUser()?.username || 'U')?.charAt(0)?.toUpperCase() || 'U' }}</div>
          <div class="user-info">
            <div class="user-name">{{ authService.currentUser()?.username || 'User' }}</div>
            <div class="user-role">Acct {{ accountDisplayId() || 'N/A' }}</div>
          </div>
          <i class="fas fa-chevron-down chevron"></i>
        </button>

        <!-- Profile Dropdown Menu -->
        <div class="profile-menu" role="menu" *ngIf="isProfileMenuOpen">
          <div class="profile-menu-header">
            <div class="profile-menu-avatar">{{ (authService.currentUser()?.username || 'U')?.charAt(0)?.toUpperCase() || 'U' }}</div>
            <div class="profile-menu-details">
              <div class="profile-menu-name">{{ authService.currentUser()?.username || 'User' }}</div>
              <div class="profile-menu-email">Account ID: {{ accountDisplayId() || 'N/A' }}</div>
            </div>
          </div>
          <div class="profile-menu-divider"></div>
          <button class="profile-menu-item">
            <i class="fas fa-user-circle"></i>
            Profile Settings
          </button>
          <button class="profile-menu-item">
            <i class="fas fa-sliders-h"></i>
            Preferences
          </button>
          <div class="profile-menu-divider"></div>
          <button class="profile-menu-item logout" (click)="logout()">
            <i class="fas fa-sign-out-alt"></i>
            Logout
          </button>
        </div>
      </div>
    </div>
  </div>
</nav>

@if (searchOpen()) {
  <!-- Loaded on first use to keep the initial bundle small -->
  @defer {
    <app-instrument-search-dialog (selected)="openInstrument($event)" (closed)="closeSearch()" />
  }
}
