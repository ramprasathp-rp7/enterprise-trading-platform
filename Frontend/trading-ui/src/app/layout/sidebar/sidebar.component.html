<!-- Professional Sidebar Component -->
<aside class="sidebar" [class.collapsed]="isCollapsed">
  <!-- Sidebar Header -->
  <div class="sidebar-header">
    <h3 class="sidebar-title">Navigation</h3>
    <button 
      class="toggle-button" 
      (click)="toggleSidebar()"
      aria-label="Toggle sidebar"
      title="Toggle sidebar"
    >
      <i class="fas fa-bars"></i>
    </button>
  </div>

  <!-- Navigation Menu -->
  <nav class="sidebar-nav">
    <ul class="nav-menu">
      <li *ngFor="let item of navigationItems" class="nav-item">
        <a 
          [routerLink]="item.route"
          routerLinkActive="active"
          [routerLinkActiveOptions]="{ paths: 'exact', queryParams: 'ignored', matrixParams: 'ignored', fragment: 'ignored' }"
          class="nav-link"
          (click)="closeSidebar()"
        >
          <span class="nav-icon">
            <i [class]="item.icon"></i>
          </span>
          <div class="nav-content">
            <span class="nav-label">{{ item.label }}</span>
            <span class="nav-description" *ngIf="!isCollapsed">{{ item.description }}</span>
          </div>
          <span *ngIf="item.badge && !isCollapsed" [class]="'badge ' + (item.badgeClass || '')">
            {{ item.badge }}
          </span>
          <span *ngIf="item.badge && isCollapsed" class="badge-dot" [class]="'badge-dot-' + (item.badgeClass || '')"></span>
        </a>
      </li>
    </ul>
  </nav>

  <!-- Sidebar Footer -->
  <div class="sidebar-footer">
    <div class="footer-content">
      <span class="footer-text" *ngIf="!isCollapsed">v1.0</span>
      <i class="fas fa-gear footer-icon" *ngIf="isCollapsed"></i>
    </div>
  </div>
</aside>

<button
  *ngIf="isCollapsed"
  class="sidebar-reopen-button"
  (click)="toggleSidebar()"
  aria-label="Reopen sidebar"
  title="Reopen sidebar"
>
  <i class="fas fa-chevron-right"></i>
</button>
