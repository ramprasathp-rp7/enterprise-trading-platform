<div class="login-container">
  <div class="login-card">
    <div class="login-header">
      <p class="eyebrow">Secure Sign In</p>
      <h1 class="login-title">Sign In — Enterprise Trading Platform</h1>
      <p class="login-subtitle">Use your workspace credentials to continue.</p>
    </div>

    <!-- Success message display (shows when login succeeds) -->
    <app-sign-in-success-message
      [isVisible]="isLoginSuccessful()">
    </app-sign-in-success-message>

    <!-- Error message display (only shows when there's an actual error) -->
    <app-sign-in-error-message
      [message]="errorMessage()"
      [errorCode]="errorCode()">
    </app-sign-in-error-message>

    <!-- Login form -->
    <app-credential-form 
      (submitAttempt)="onSubmit($event)"
      [isDisabled]="isLoading()"
      [class.is-loading]="isLoading()">
    </app-credential-form>

    <!-- Loading/Processing indicator -->
    <div *ngIf="isLoading()" class="loading-indicator">
      <div class="spinner"></div>
      <span>Signing in...</span>
    </div>
  </div>
</div>
