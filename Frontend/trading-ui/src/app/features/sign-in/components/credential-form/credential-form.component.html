<form (ngSubmit)="onSubmit()" class="credential-form">
  <div class="form-group">
    <label for="username">Username</label>
    <input
      id="username"
      name="username"
      data-testid="username-input"
      type="text"
      [ngModel]="username()"
      (ngModelChange)="username.set($event)"
      (blur)="onUsernameBlur()"
      placeholder="Enter your username"
      class="form-control"
      [disabled]="isDisabled()"
      [class.is-invalid]="usernameErrors().length > 0"
    />
    <div class="invalid-feedback" *ngIf="usernameErrors().length > 0">
      <div *ngFor="let error of usernameErrors()">{{ error }}</div>
    </div>
  </div>

  <div class="form-group">
    <label for="password">Password</label>
    <input
      id="password"
      name="password"
      data-testid="password-input"
      type="password"
      [ngModel]="password()"
      (ngModelChange)="password.set($event)"
      (blur)="onPasswordBlur()"
      placeholder="Enter your password"
      class="form-control"
      [disabled]="isDisabled()"
      [class.is-invalid]="passwordErrors().length > 0"
    />
    <div class="invalid-feedback" *ngIf="passwordErrors().length > 0">
      <div *ngFor="let error of passwordErrors()">{{ error }}</div>
    </div>
  </div>

  <button
    type="submit"
    data-testid="submit-btn"
    [disabled]="isFormDisabled()"
    class="btn btn-primary btn-lg w-100"
  >
    Sign In
  </button>
</form>
