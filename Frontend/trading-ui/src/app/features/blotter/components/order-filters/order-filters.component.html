<div class="history-controls toolbar">
  <div class="filter-group">
    <label for="status-filter">Status</label>
    <select
      id="status-filter"
      [(ngModel)]="selectedStatus"
      (change)="onStatusChange()"
      class="filter-select status-select"
    >
      <option value="">All statuses</option>
      <option [value]="statusOptions.New">NEW</option>
      <option [value]="statusOptions.Filled">FILLED</option>
      <option [value]="statusOptions.Rejected">REJECTED</option>
      <option [value]="statusOptions.Cancelled">CANCELLED</option>
    </select>
  </div>

  <div class="filter-group id-search-group">
    <label for="symbol-filter">Symbol</label>
    <div class="input-with-icon">
      <i class="fas fa-magnifying-glass"></i>
      <input
        id="symbol-filter"
        type="text"
        [(ngModel)]="selectedSymbol"
        (input)="onSymbolChange()"
        placeholder="e.g. AAPL"
        class="id-search-input"
        maxlength="10"
      />
    </div>
  </div>

  @if (isFilterActive()) {
    <button class="btn btn-ghost btn-sm clear-search-btn" (click)="onClearFilters()" type="button" title="Clear all filters">
      <i class="fas fa-xmark"></i> Clear
    </button>
  }
</div>
