[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "trading-analytics-etl"
version = "0.1.0"
description = "Sprint 4: Fauxnance market-data ETL, extract/transform/load into DuckDB, with the dashboard that reads it back."
requires-python = ">=3.10"
dependencies = [
    "requests>=2.31",
    "pandas>=2.0",
    "plotly>=5.18",
    "python-dotenv>=1.0",
    "duckdb>=0.10",
    "psycopg2-binary>=2.9",
]

# `pip install -e 'sprint-04-analytics-etl[dev]'` — the engineering contract's
# second fixed point.
[project.optional-dependencies]
dev = ["pytest>=7.4"]

# The engineering contract's entry-point requirement: a teammate runs
# `trading-analytics-etl` after installing, with no source reading required.
# (There's also a `__main__.py`, so `python -m trading_analytics` works too —
# belt and suspenders — but this console script is the one named in
# claims.md and in manifest.env, per the "say which" instruction.)
[project.scripts]
trading-analytics-etl = "trading_analytics.pipeline:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
