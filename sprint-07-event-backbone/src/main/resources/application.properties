# Database config for local run; override via environment variables in Docker/CI.
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:enterprise_trading_platform}
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASSWORD:<your_password_here>}
spring.datasource.driver-class-name=org.postgresql.Driver

mybatis.configuration.map-underscore-to-camel-case=true

# Kafka config for local run; override via KAFKA_BOOTSTRAP_SERVERS environment variable in Docker/CI.
spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:${EC2_PRIVATE_IP:localhost}:9092}

server.port=8081

# Trading Platform Preferences Configuration
# Platform-wide default preferences that users inherit unless they override
trading-platform.preferences.defaults.NOTIFICATION_EMAIL=true
trading-platform.preferences.defaults.NOTIFICATION_TRADING_ALERTS=true
trading-platform.preferences.defaults.DISPLAY_THEME=light
trading-platform.preferences.defaults.DISPLAY_CURRENCY=USD
trading-platform.preferences.defaults.TRADING_DEFAULT_ORDER_TYPE=LIMIT
trading-platform.preferences.defaults.TRADING_MAX_ORDER_SIZE=10000
trading-platform.preferences.defaults.TIMEZONE=UTC
trading-platform.preferences.defaults.LANGUAGE=en

# Analytics ETL Configuration
analytics.duckdb-path=analytics_store.duckdb
analytics.watermark-table-name=analytics_watermarks
analytics.dead-letter-log-path=analytics_store.duckdb.dlq

logging.level.root=INFO