spring.config.import=optional:file:${user.dir}/../../.env[.properties]

# Local DB placeholders - override with env vars
spring.datasource.url=jdbc:postgresql://${PGHOST:localhost}:${PGPORT:5432}/${POSTGRES_DB:enterprise_trading_platform}
spring.datasource.username=${PGUSER:postgres}
spring.datasource.password=${PGPASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# MyBatis convenience
mybatis.configuration.map-underscore-to-camel-case=true

# Kafka bootstrap servers
spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:${EC2_PRIVATE_IP:localhost}:9092}

server.port=8000
logging.level.root=INFO

# Market Data Poller Configuration
# Poll interval in seconds for fetching market data from Fauxnance and publishing to Kafka
# Every 5 minutes, matching the order service's own quote cache refresh (288 requests/day for up to 25 symbols)
# Minimum allowed value is controlled by MIN_POLL_INTERVAL_SECONDS
POLL_INTERVAL_SECONDS=300

# Minimum allowed poll interval in seconds (safety limit to prevent excessive API calls)
# If POLL_INTERVAL_SECONDS is set below this value, it will be clamped to this minimum
MIN_POLL_INTERVAL_SECONDS=60

mybatis.type-handlers-package=com.tradingplatform.mappers