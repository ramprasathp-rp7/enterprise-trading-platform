# Shared platform config (ports, database). Any key can be overridden by an env var,
# e.g. SERVICES_ORDER_PORT or DATABASE_NAME.
spring.config.import=optional:file:${user.dir}/../../.env[.properties],optional:file:${user.dir}/../../Config/application.yaml

# Local DB placeholders - override with env vars
spring.datasource.url=jdbc:postgresql://${database.host}:${database.port}/${database.name}
spring.datasource.username=${database.user}
spring.datasource.password=${PGPASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# MyBatis convenience
mybatis.configuration.map-underscore-to-camel-case=true

# Kafka bootstrap servers
spring.kafka.bootstrap-servers=${EC2_PRIVATE_IP}:${kafka.port}

# Fauxnance quote client settings
fauxnance.base-url=${FAUXNANCE_BASE_URL:${fauxnance.url}}
fauxnance.api-key=${FAUXNANCE_API_KEY:}

# Kafka producer timeouts: fail fast while the broker is down instead of blocking for 60 s
spring.kafka.producer.properties.max.block.ms=${KAFKA_PRODUCER_MAX_BLOCK_MS:3000}
spring.kafka.producer.properties.request.timeout.ms=${KAFKA_PRODUCER_REQUEST_TIMEOUT_MS:10000}
spring.kafka.producer.properties.delivery.timeout.ms=${KAFKA_PRODUCER_DELIVERY_TIMEOUT_MS:30000}

# Trade event replay: republishes ORDER_FILLED / ORDER_REJECTED that never reached Kafka (orders.event_pending).
# grace-ms must stay above delivery.timeout.ms so a settlement's own publish is not raced.
trading.outcome-replay.interval-ms=${TRADING_OUTCOME_REPLAY_INTERVAL_MS:30000}
trading.outcome-replay.initial-delay-ms=30000
trading.outcome-replay.grace-ms=${TRADING_OUTCOME_REPLAY_GRACE_MS:60000}
trading.outcome-replay.batch-size=${TRADING_OUTCOME_REPLAY_BATCH_SIZE:100}
trading.outcome-replay.publish-timeout-ms=${TRADING_OUTCOME_REPLAY_PUBLISH_TIMEOUT_MS:5000}

# Dead letters: a record is acknowledged only once its orders.DLT copy is written; otherwise it is
# nacked and redelivered after the back-off
dead-letter.send-timeout-ms=${DEAD_LETTER_SEND_TIMEOUT_MS:5000}
dead-letter.nack-backoff-ms=${DEAD_LETTER_NACK_BACKOFF_MS:5000}

server.port=${services.executor.port}
logging.level.root=INFO

# Market Data Poller Configuration
# Poll interval in seconds for fetching market data from Fauxnance and publishing to Kafka
# Every 5 minutes, matching the order service's own quote cache refresh (288 requests/day for up to 25 symbols)
# Minimum allowed value is controlled by min.poll.interval.seconds
poll.interval.seconds=${POLL_INTERVAL_SECONDS:300}

# Minimum allowed poll interval in seconds (safety limit to prevent excessive API calls)
# If poll.interval.seconds is set below this value, it will be clamped to this minimum
min.poll.interval.seconds=${MIN_POLL_INTERVAL_SECONDS:60}

mybatis.type-handlers-package=com.tradingplatform.mappers