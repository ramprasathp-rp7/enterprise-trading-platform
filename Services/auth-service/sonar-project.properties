# SonarQube config for the NestJS auth-service.
# Token and host URL are passed on the command line - never commit a token here.
sonar.projectKey=auth-service
sonar.projectName=auth-service
sonar.sourceEncoding=UTF-8

sonar.sources=src
sonar.tests=src
sonar.test.inclusions=**/*.spec.ts
sonar.exclusions=**/node_modules/**,dist/**,**/*.spec.ts

# Bootstrap file is not unit-tested
sonar.coverage.exclusions=src/main.ts,**/*.spec.ts,**/*.module.ts

# Produced by: npm run test:cov
sonar.javascript.lcov.reportPaths=coverage/lcov.info
