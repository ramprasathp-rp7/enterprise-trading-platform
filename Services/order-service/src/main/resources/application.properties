# Import the .env file located one level above the project root directory
spring.config.import=optional:file:${user.dir}/../../.env[.properties]

# Database config for local run; override via environment variables in Docker/CI.
spring.datasource.url=jdbc:postgresql://${PGHOST:localhost}:${PGPORT:5432}/${POSTGRES_DB:enterprise_trading_platform}
spring.datasource.username=${PGUSER:postgres}
spring.datasource.password=${PGPASSWORD:<your_password_here>}
spring.datasource.driver-class-name=org.postgresql.Driver

mybatis.configuration.map-underscore-to-camel-case=true
mybatis.type-handlers-package=com.tradingplatform.api.mybatis

# Kafka Producer config for publishing events
spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:${EC2_PRIVATE_IP:localhost}:9092}

# Kafka Consumer config for consuming events (used by Trade Executor and extension modules)
spring.kafka.consumer.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:${EC2_PRIVATE_IP:localhost}:9092}
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.enable-auto-commit=false
spring.kafka.consumer.max-poll-records=100
spring.kafka.consumer.session-timeout-ms=10000

# Kafka listener container properties
spring.kafka.listener.ack-mode=manual_immediate
spring.kafka.listener.poll-timeout=3000

# Trading Execution Mode: sync (Sprint 6) or async (Sprint 7, default)
# SYNC: POST /api/v1/orders validates, settles immediately, returns FILLED/REJECTED
# ASYNC: POST /api/v1/orders validates, publishes to orders topic, returns NEW
trading.execution.mode=${TRADING_EXECUTION_MODE:ASYNC}

server.port=8080


# Candle chart data sync configuration
trading.candle.bootstrap.enabled=true
trading.candle.sync.cron=0 0 1 * * ?
trading.candle.sync.retry.cron=0 0 2 * * ?
trading.candle.purge.cron=0 0 3 ? * MON
trading.candle.api.max-date-range=90
trading.candle.retention.days=90

logging.level.root=INFO

# Market data quote source for the cache: FAUXNANCE (poll the quotes API every 5 minutes)
# or KAFKA (consume QUOTE events from the market-data topic)
market-data.quote-source=${MARKET_DATA_QUOTE_SOURCE:FAUXNANCE}
market-data.refresh.interval-ms=300000
market-data.refresh.initial-delay-ms=0
# How long each symbol's quote history is kept in the cache (ISO-8601 duration; the newest quote is always kept)
market-data.cache.history-window=${MARKET_DATA_CACHE_HISTORY_WINDOW:PT24H}

# Account History Scheduler Configuration
# Runs end-of-day account snapshot capture
# Default: 23:59 UTC daily (0 59 23 * * *)
scheduler.account-history.cron=${SCHEDULER_ACCOUNT_HISTORY_CRON:0 59 23 * * *}
scheduler.account-history.enabled=${SCHEDULER_ACCOUNT_HISTORY_ENABLED:true}

# Price alerts (watchlist.alerts): caps per account, and how often cached quotes are checked against active alerts
price-alerts.max-active-per-account=${PRICE_ALERTS_MAX_ACTIVE_PER_ACCOUNT:20}
price-alerts.max-per-account=${PRICE_ALERTS_MAX_PER_ACCOUNT:100}
price-alerts.evaluate.interval-ms=${PRICE_ALERTS_EVALUATE_INTERVAL_MS:30000}
price-alerts.evaluate.initial-delay-ms=30000

# Automated strategies: evaluated against the market-data cache; orders go through POST /api/v1/orders
trading.strategy.enabled=${TRADING_STRATEGY_ENABLED:true}
trading.strategy.trade-api-url=${TRADING_STRATEGY_TRADE_API_URL:http://localhost:${server.port:8080}}
trading.strategy.evaluate.interval-ms=${TRADING_STRATEGY_EVALUATE_INTERVAL_MS:60000}
trading.strategy.evaluate.initial-delay-ms=30000
trading.strategy.max-active-per-account=${TRADING_STRATEGY_MAX_ACTIVE_PER_ACCOUNT:10}
trading.strategy.token-ttl-seconds=60
trading.strategy.order-timeout-ms=5000
# Demo aid: wait this long between a trigger and its order, to show a disable landing mid-cycle
trading.strategy.pause-before-order-ms=${TRADING_STRATEGY_PAUSE_BEFORE_ORDER_MS:0}
